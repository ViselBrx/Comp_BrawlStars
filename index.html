<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Brawl Stars Trio Random Comp</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Brawl Stars Trio Random Comp</h1>

        <p>
            Sorteie uma composição aleatória de três brawlers sem repetição.
        </p>

        <div class="actions">
            <button id="sortear">
                Sortear Trio
            </button>
            <button id="limpar" class="btn-secundario">
                Limpar
            </button>
        </div>

        <section class="resultado">

            <div class="card">
                <h2>Jogador 1</h2>
                <p id="p1">?</p>
            </div>

            <div class="card">
                <h2>Jogador 2</h2>
                <p id="p2">?</p>
            </div>

            <div class="card">
                <h2>Jogador 3</h2>
                <p id="p3">?</p>
            </div>

        </section>

    </div>

    <script src="script.js"></script>

</body>

</html>
